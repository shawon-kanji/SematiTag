[project]
name = "semantitag"
version = "0.1.0"
description = "Mock FastAPI service scaffolded for SemantiTag"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.5,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.1",
    "onnxruntime<1.19; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<1.0.0",
    "pytest>=8.2.0,<9.0.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
